<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
    @font-face { font-family: "Cascadia Code"; src: local("Cascadia Code"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #0A0D11;
      color: #E6EAF0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .scene { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; overflow: hidden; }
    #scene1 { z-index: 1; }
    #scene2 { z-index: 2; opacity: 0; }
    #scene3 { z-index: 3; opacity: 0; }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(circle at 72% 46%, #000 22%, transparent 78%);
      mask-image: radial-gradient(circle at 72% 46%, #000 22%, transparent 78%);
    }
    .glow { position: absolute; inset: 0; background: radial-gradient(circle at 74% 42%, rgba(255,107,44,.16), transparent 52%); }
    .glow-cool { background: radial-gradient(circle at 72% 56%, rgba(74,158,255,.12), transparent 50%); }
    .scan {
      position: absolute;
      left: 46%;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FF6B2C, transparent);
      opacity: 0;
    }
    .tag {
      position: absolute;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 18px;
      letter-spacing: .12em;
      color: #6A7686;
    }
    .tag-accent { color: #FF6B2C; }
    .ticker { position: absolute; right: 132px; bottom: 132px; display: flex; gap: 54px; }
    .ticker div { text-align: right; }
    .ticker b {
      display: block;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 64px;
      line-height: 1;
      font-weight: 600;
      color: #E6EAF0;
    }
    .ticker span { display: block; margin-top: 10px; font-size: 18px; color: #98A5B5; }
    .ticker i { display: block; width: 64px; height: 3px; background: #FF6B2C; margin: 14px 0 0 auto; }
    .graph { position: absolute; right: 96px; top: 96px; width: 880px; height: 708px; }
    .graph path { fill: none; stroke: rgba(255,107,44,.55); stroke-width: 2; stroke-dasharray: 900; stroke-dashoffset: 900; }
    .graph path.cool { stroke: rgba(74,158,255,.45); }
    .graph circle { fill: #141A21; stroke: rgba(255,255,255,.28); stroke-width: 2; }
    .graph circle.hot { stroke: #FF6B2C; }
    .graph text {
      fill: #98A5B5;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 17px;
    }
    .packet { fill: #FF6B2C; }
    .frame {
      position: absolute;
      right: 96px;
      top: 96px;
      width: 880px;
      height: 708px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .frame:before, .frame:after {
      content: "";
      position: absolute;
      width: 46px;
      height: 46px;
      border: 2px solid #FF6B2C;
    }
    .frame:before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
    .frame:after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
    .frame-label {
      position: absolute;
      left: 18px;
      bottom: 18px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 18px;
      color: #FF6B2C;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="skillx-hero-bg" data-width="1600" data-height="900" data-fps="30" data-start="0" data-duration="8.5">
    <div id="scene1" class="scene">
      <div class="grid-bg"></div>
      <div class="glow"></div>
      <div class="scan" id="s1-scan"></div>
      <div class="frame" id="s1-frame">
        <div class="frame-label" id="s1-frame-label">LIVE INDEX</div>
      </div>
      <div class="ticker">
        <div id="s1-t1"><b>05</b><span>自研技能</span><i></i></div>
        <div id="s1-t2"><b>04</b><span>社区精选</span><i></i></div>
        <div id="s1-t3"><b>08</b><span>项安全审计</span><i></i></div>
      </div>
      <div class="tag" id="s1-tag" style="left:820px;top:140px;">SKILL X // SIGNAL</div>
    </div>

    <div id="scene2" class="scene">
      <div class="grid-bg"></div>
      <div class="glow glow-cool"></div>
      <svg class="graph" viewBox="0 0 880 708">
        <path id="p1" d="M60 120 L300 120 L300 300 L560 300" />
        <path id="p2" d="M60 360 L240 360 L240 540 L520 540" class="cool" />
        <path id="p3" d="M560 300 L760 300 L760 150" />
        <path id="p4" d="M520 540 L760 540 L760 640" class="cool" />
        <path id="p5" d="M300 300 L300 480 L520 540" />
        <circle cx="60" cy="120" r="9" class="hot" />
        <circle cx="300" cy="120" r="9" />
        <circle cx="300" cy="300" r="9" class="hot" />
        <circle cx="560" cy="300" r="9" />
        <circle cx="760" cy="300" r="9" />
        <circle cx="760" cy="150" r="9" />
        <circle cx="60" cy="360" r="9" class="hot" />
        <circle cx="240" cy="360" r="9" />
        <circle cx="240" cy="540" r="9" />
        <circle cx="520" cy="540" r="9" class="hot" />
        <circle cx="760" cy="640" r="9" />
        <circle id="packet" class="packet" cx="60" cy="120" r="6" />
        <text x="78" y="112">triage</text>
        <text x="318" y="292">unpack</text>
        <text x="578" y="292">map</text>
        <text x="778" y="292">audit</text>
        <text x="78" y="352">request</text>
        <text x="258" y="532">evidence</text>
        <text x="538" y="532">report</text>
      </svg>
      <div class="tag tag-accent" id="s2-tag" style="left:96px;top:120px;">GROUNDED TRACE</div>
    </div>

    <div id="scene3" class="scene">
      <div class="grid-bg"></div>
      <div class="glow"></div>
      <div class="frame" id="s3-frame">
        <div class="frame-label" id="s3-frame-label">skillx.yueliai.top</div>
      </div>
      <div class="tag" id="s3-tag" style="left:96px;top:120px;">BROWSE · CONNECT · AUDIT</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* Scene 1: live index */
    tl.from("#s1-frame", { scale: 0.96, opacity: 0, duration: 0.8, ease: "expo.out" }, 0.2);
    tl.from("#s1-frame-label", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.45);
    tl.from("#s1-tag", { y: 14, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.55);
    tl.from("#s1-t1", { y: 26, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.65);
    tl.from("#s1-t2", { y: 26, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.8);
    tl.from("#s1-t3", { y: 26, opacity: 0, duration: 0.6, ease: "power4.out" }, 0.95);
    tl.fromTo("#s1-scan", { y: -30, opacity: 0 }, { y: 880, opacity: 1, duration: 2.9, ease: "none" }, 0.35);

    /* Transition 1: blur crossfade */
    tl.to("#scene1", { filter: "blur(16px)", scale: 1.02, opacity: 0, duration: 0.55, ease: "power2.inOut" }, 3.1);
    tl.fromTo("#scene2", { filter: "blur(16px)", scale: 0.98, opacity: 0 },
      { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.65, ease: "power2.out" }, 3.2);

    /* Scene 2: grounded trace */
    tl.from("#s2-tag", { x: -18, opacity: 0, duration: 0.5, ease: "power2.out" }, 3.45);
    tl.fromTo("#p1", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 3.6);
    tl.fromTo("#p2", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 3.78);
    tl.fromTo("#p3", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.8, ease: "power3.inOut" }, 3.96);
    tl.fromTo("#p4", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.8, ease: "power3.inOut" }, 4.14);
    tl.fromTo("#p5", { strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.7, ease: "power4.inOut" }, 4.32);
    tl.from(".graph circle", { scale: 0.4, opacity: 0, duration: 0.45, ease: "power3.out", transformOrigin: "center" }, 3.9);
    tl.from(".graph text", { opacity: 0, y: 8, duration: 0.4, ease: "power2.out" }, 4.4);
    tl.fromTo("#packet", { x: 0, y: 0 }, { x: 240, y: 0, duration: 0.7, ease: "power1.inOut" }, 4.5);
    tl.to("#packet", { x: 240, y: 180, duration: 0.7, ease: "power1.inOut" }, 5.2);
    tl.to("#packet", { x: 500, y: 180, duration: 0.7, ease: "power1.inOut" }, 5.9);

    /* Transition 2: crossfade */
    tl.to("#scene2", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 6.6);
    tl.fromTo("#scene3", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.inOut" }, 6.65);

    /* Scene 3: closing frame */
    tl.from("#s3-frame", { scale: 1.04, opacity: 0, duration: 0.7, ease: "expo.out" }, 6.8);
    tl.from("#s3-frame-label", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 7.0);
    tl.from("#s3-tag", { y: 14, opacity: 0, duration: 0.5, ease: "power3.out" }, 7.12);

    /* Final fade (loop-friendly) */
    tl.to("#scene3", { opacity: 0, duration: 0.55, ease: "power1.inOut" }, 7.95);

    window.__timelines["skillx-hero-bg"] = tl;
  </script>
</body>
</html>
