<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
    @font-face { font-family: "Cascadia Code"; src: local("Cascadia Code"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #0A0D11;
      color: #E6EAF0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .scene { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; overflow: hidden; }
    .scene-content {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 104px 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(circle at 38% 46%, #000 18%, transparent 76%);
      mask-image: radial-gradient(circle at 38% 46%, #000 18%, transparent 76%);
    }
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 44%, rgba(255,107,44,.17), transparent 52%);
    }
    .glow-right { background: radial-gradient(circle at 74% 52%, rgba(74,158,255,.13), transparent 48%); }
    #scene1 { z-index: 1; }
    #scene2 { z-index: 2; opacity: 0; }
    #scene3 { z-index: 3; opacity: 0; }
    .eyebrow {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 20px;
      letter-spacing: .14em;
      color: #FF6B2C;
      text-transform: uppercase;
    }
    .title {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 152px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .rule { width: 220px; height: 3px; background: #FF6B2C; }
    .offer { font-size: 46px; line-height: 1.3; color: #E6EAF0; max-width: 24ch; font-weight: 600; }
    .sub { font-size: 24px; color: #98A5B5; max-width: 60ch; }
    .scan {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FF6B2C, transparent);
      opacity: 0;
    }
    .stats { display: flex; align-items: stretch; gap: 0; }
    .stat {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      padding: 34px 40px 38px;
      border-left: 1px solid rgba(255,255,255,.09);
    }
    .stat:first-child { border-left: 0; }
    .stat b {
      display: block;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 104px;
      line-height: 1;
      font-weight: 600;
      color: #E6EAF0;
    }
    .stat span { display: block; font-size: 24px; color: #98A5B5; margin-top: 14px; }
    .hl { position: absolute; left: 40px; bottom: 22px; width: 96px; height: 3px; background: #FF6B2C; }
    .headline {
      font-size: 72px;
      line-height: 1.22;
      font-weight: 700;
      max-width: 20ch;
    }
    .domain {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 30px;
      color: #FF6B2C;
      letter-spacing: .02em;
    }
    .chips { display: flex; gap: 16px; margin-top: 12px; }
    .chips span {
      font-size: 24px;
      color: #E6EAF0;
      border: 1px solid rgba(255,255,255,.16);
      padding: 14px 30px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="skillx-hero" data-width="1600" data-height="900" data-fps="30" data-start="0" data-duration="9">
    <div id="scene1" class="scene">
      <div class="grid-bg"></div>
      <div class="glow"></div>
      <div class="scan" id="s1-scan"></div>
      <div class="scene-content">
        <div class="eyebrow" id="s1-eyebrow">security research skills for AI agents</div>
        <h1 class="title" id="s1-title">Skill X</h1>
        <div class="rule" id="s1-rule"></div>
        <div class="offer" id="s1-offer">给 AI Agent 的安全研究技能库</div>
        <div class="sub" id="s1-sub">逆向、渗透、样本分析、内存取证。每个技能都带安全审计、结构导图与可调用工具。</div>
      </div>
    </div>

    <div id="scene2" class="scene">
      <div class="grid-bg"></div>
      <div class="glow glow-right"></div>
      <div class="scene-content">
        <div class="stats">
          <div class="stat" id="s2-stat1"><b>05</b><span>自研技能</span><i class="hl" id="s2-hl1"></i></div>
          <div class="stat" id="s2-stat2"><b>04</b><span>社区精选</span><i class="hl" id="s2-hl2"></i></div>
          <div class="stat" id="s2-stat3"><b>08</b><span>项安全审计</span><i class="hl" id="s2-hl3"></i></div>
        </div>
      </div>
    </div>

    <div id="scene3" class="scene">
      <div class="grid-bg"></div>
      <div class="glow"></div>
      <div class="scene-content">
        <div class="headline" id="s3-headline">技能库、MCP 服务与安全审计，一处可查。</div>
        <div class="domain" id="s3-domain">skillx.yueliai.top</div>
        <div class="chips">
          <span id="s3-c1">浏览技能库</span>
          <span id="s3-c2">查看 MCP 服务</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* Scene 1: title card */
    tl.from("#s1-eyebrow", { y: 18, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.15);
    tl.from("#s1-title", { y: 44, opacity: 0, duration: 0.85, ease: "expo.out" }, 0.28);
    tl.from("#s1-rule", { scaleX: 0, duration: 0.6, ease: "power3.inOut", transformOrigin: "left center" }, 0.7);
    tl.from("#s1-offer", { y: 26, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.62);
    tl.from("#s1-sub", { y: 20, opacity: 0, duration: 0.55, ease: "power4.out" }, 0.82);
    tl.fromTo("#s1-scan", { y: -40, opacity: 0 }, { y: 940, opacity: 1, duration: 3.1, ease: "none" }, 0.2);

    /* Transition 1: blur crossfade */
    tl.to("#scene1", { filter: "blur(18px)", scale: 1.03, opacity: 0, duration: 0.55, ease: "power2.inOut" }, 3.3);
    tl.fromTo("#scene2", { filter: "blur(18px)", scale: 0.98, opacity: 0 },
      { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, 3.4);

    /* Scene 2: real numbers */
    tl.from("#s2-stat1", { y: 30, opacity: 0, duration: 0.65, ease: "expo.out" }, 3.75);
    tl.from("#s2-stat2", { y: 30, opacity: 0, duration: 0.65, ease: "power3.out" }, 3.9);
    tl.from("#s2-stat3", { y: 30, opacity: 0, duration: 0.65, ease: "power4.out" }, 4.05);
    tl.from("#s2-hl1", { scaleX: 0, duration: 0.4, ease: "power2.out", transformOrigin: "left center" }, 4.1);
    tl.from("#s2-hl2", { scaleX: 0, duration: 0.4, ease: "power2.out", transformOrigin: "left center" }, 4.25);
    tl.from("#s2-hl3", { scaleX: 0, duration: 0.4, ease: "power2.out", transformOrigin: "left center" }, 4.4);

    /* Transition 2: crossfade */
    tl.to("#scene2", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 6.5);
    tl.fromTo("#scene3", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.inOut" }, 6.55);

    /* Scene 3: closing card */
    tl.from("#s3-headline", { y: 34, opacity: 0, duration: 0.75, ease: "expo.out" }, 6.7);
    tl.from("#s3-domain", { y: 18, opacity: 0, duration: 0.5, ease: "power3.out" }, 7.0);
    tl.from("#s3-c1", { y: 14, opacity: 0, duration: 0.45, ease: "power2.out" }, 7.15);
    tl.from("#s3-c2", { y: 14, opacity: 0, duration: 0.45, ease: "power4.out" }, 7.28);

    /* Final scene may fade out (loop-friendly) */
    tl.to("#scene3", { opacity: 0, duration: 0.6, ease: "power1.inOut" }, 8.4);

    window.__timelines["skillx-hero"] = tl;
  </script>
</body>
</html>
