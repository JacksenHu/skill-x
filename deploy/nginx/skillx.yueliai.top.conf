server {
    listen 80;
    server_name skillx.yueliai.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skillx.yueliai.top;
    root /www/wwwroot/skillx.yueliai.top;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/cert/skillx.yueliai.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/skillx.yueliai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # 安全基线头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 思维导图开放外部引用(跨域 <img>/embed)
    location /mindmaps/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API 与下载代理:反代到本机后端(127.0.0.1:8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
    location /dl/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
