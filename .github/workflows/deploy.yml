name: deploy

# 手动触发的整站部署:构建 dist -> 打包 -> SSH 上传 -> 原子替换 -> reload nginx
# 走 SSH 而非宝塔 API:面板 API 有来源 IP 白名单,而 runner 出口 IP 每次运行都可能变。
# 依赖仓库 secret SSH_PRIVATE_KEY(服务器 root 私钥),不入库、不落日志。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: 124.156.167.163
  SSH_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show source revision
        run: git log -1 --oneline

      - name: Build dist
        env:
          PYTHONIOENCODING: utf-8
        run: python showcase/build_index.py

      - name: Pack dist
        run: tar czf /tmp/skillx-dist.tar.gz -C showcase/dist .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secret SSH_PRIVATE_KEY not set"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'echo ssh-ok'

      - name: Upload artifacts
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/skillx-dist.tar.gz "$SSH_USER@$SSH_HOST:/www/wwwroot/"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'mkdir -p /www/wwwroot/skillx-api'
          scp -i ~/.ssh/id_ed25519 api/server.py api/registry.json "$SSH_USER@$SSH_HOST:/www/wwwroot/skillx-api/"
          scp -i ~/.ssh/id_ed25519 mcp-registry.json packs.json "$SSH_USER@$SSH_HOST:/www/wwwroot/"

      - name: Swap site (atomic) + reload nginx
        run: ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'bash -s' < deploy/remote_deploy.sh

      - name: Verify live site
        run: |
          python - <<'PY'
          import urllib.request
          base = "https://skillx.yueliai.top"
          for path in ("/", "/tools.html", "/tools/nuclei.html", "/site-data.json"):
              req = urllib.request.Request(base + path, headers={"User-Agent": "skillx-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
              print(path, "->", r.status, len(body), "bytes")
          req = urllib.request.Request(base + "/tools.html", headers={"User-Agent": "skillx-ci"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          print("tool cards:", html.count('class="card cat-'))
          PY